<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Collector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Tab Collector</h1>
    <div class="header-actions">
      <button id="btn-group-now" title="Group all ungrouped tabs now">Group Now</button>
      <button id="btn-json" title="Edit all rule sets as JSON">JSON</button>
    </div>
  </header>

  <section class="settings-bar">
    <label class="toggle">
      <input type="checkbox" id="toggle-auto">
      <span class="slider"></span>
      Auto-group
    </label>
  </section>

  <!-- Rule set list -->
  <section id="ruleset-list"></section>

  <button id="btn-add-ruleset" class="btn-add">+ Add Rule Set</button>

  <!-- Rule set editor (hidden by default) -->
  <section id="editor" class="hidden">
    <h2 id="editor-title">New Rule Set</h2>

    <div class="field">
      <label for="rs-name">Rule Set Name</label>
      <input type="text" id="rs-name" placeholder="e.g. Ticket Grouping, Social Media">
    </div>

    <div class="field">
      <label for="rs-group-name">Group Title</label>
      <input type="text" id="rs-group-name" placeholder="e.g. $1 or JIRA-$1 (leave blank to use name)">
      <span class="hint">Use $1, $2… to insert regex captures. Each unique value creates a separate group.</span>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="rs-color">Color</label>
        <select id="rs-color">
          <option value="grey">Grey</option>
          <option value="blue">Blue</option>
          <option value="red">Red</option>
          <option value="yellow">Yellow</option>
          <option value="green">Green</option>
          <option value="pink">Pink</option>
          <option value="purple">Purple</option>
          <option value="cyan">Cyan</option>
          <option value="orange">Orange</option>
        </select>
      </div>

      <div class="field">
        <label for="rs-match-mode">Match</label>
        <select id="rs-match-mode">
          <option value="all">All rules (AND)</option>
          <option value="any">Any rule (OR)</option>
        </select>
      </div>

      <div class="field">
        <label for="rs-priority">Priority</label>
        <input type="number" id="rs-priority" value="0" min="0" max="999">
      </div>
    </div>

    <h3>Rules</h3>
    <div id="rules-container"></div>
    <button id="btn-add-rule" class="btn-add-sm">+ Add Rule</button>

    <div class="editor-actions">
      <button id="btn-save" class="btn-primary">Save</button>
      <button id="btn-cancel" class="btn-secondary">Cancel</button>
    </div>
  </section>

  <!-- JSON editor (hidden by default) -->
  <section id="json-editor" class="hidden">
    <h2>JSON Editor</h2>
    <textarea id="json-textarea" spellcheck="false"></textarea>
    <div id="json-error" class="json-error hidden"></div>
    <div class="editor-actions">
      <button id="btn-json-import" class="btn-secondary">Import</button>
      <button id="btn-json-export" class="btn-secondary">Export</button>
      <button id="btn-json-save" class="btn-primary">Save</button>
      <button id="btn-json-cancel" class="btn-secondary">Cancel</button>
    </div>
    <input type="file" id="json-file-input" accept=".json" class="hidden">
  </section>

  <script src="../storage.js"></script>
  <script src="../rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
